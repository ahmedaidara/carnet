<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Simple - La Voie du Salut</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            background: #2e7d32;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 {
            font-size: 24px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
            color: #2e7d32;
        }
        
        .search-box {
            margin-bottom: 20px;
        }
        
        .search-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        
        .refresh-btn {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        
        .users-table {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: #2e7d32;
            color: white;
            padding: 15px;
            text-align: left;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        
        tr:hover {
            background: #f9f9f9;
        }
        
        .status-paid {
            background: #d4edda;
            color: #155724;
            padding: 5px 10px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
        }
        
        .status-free {
            background: #fff3cd;
            color: #856404;
            padding: 5px 10px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
        }
        
        .btn-paid {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }
        
        .btn-unpaid {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }
        
        .export-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-users"></i> Administration - La Voie du Salut</h1>
            <div>
                <button class="export-btn" id="exportBtn">
                    <i class="fas fa-download"></i> Exporter CSV
                </button>
            </div>
        </header>
        
        <div class="stats">
            <div class="stat-card">
                <h3>Total inscrits</h3>
                <div class="number" id="totalUsers">0</div>
            </div>
            <div class="stat-card">
                <h3>Payants</h3>
                <div class="number" id="paidUsers">0</div>
            </div>
            <div class="stat-card">
                <h3>Gratuits</h3>
                <div class="number" id="freeUsers">0</div>
            </div>
        </div>
        
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <div class="search-box" style="flex: 1;">
                <input type="text" id="searchInput" placeholder="Rechercher par email...">
            </div>
            <button class="refresh-btn" id="refreshBtn">
                <i class="fas fa-sync-alt"></i> Actualiser
            </button>
        </div>
        
        <div class="users-table">
            <table>
                <thead>
                    <tr>
                        <th>Email</th>
                        <th>Statut</th>
                        <th>Date d'inscription</th>
                        <th>Dernière activité</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr>
                        <td colspan="5" class="loading">
                            <i class="fas fa-spinner fa-spin"></i> Chargement des utilisateurs...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        // Configuration Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyA6VxGekfO97Oo59OVkX6d1gDgbRiKczJw",
            authDomain: "la-voie-du-salut-51126.firebaseapp.com",
            projectId: "la-voie-du-salut-51126",
            storageBucket: "la-voie-du-salut-51126.firebasestorage.app",
            messagingSenderId: "197463266661",
            appId: "1:197463266661:web:b343a7f6fd8f0112cb3d8c"
        };
        
        // Initialiser Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        
        // Variables
        let allUsers = [];
        
        // Charger tous les utilisateurs
        async function loadUsers() {
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '<tr><td colspan="5" class="loading"><i class="fas fa-spinner fa-spin"></i> Chargement...</td></tr>';
            
            try {
                const snapshot = await db.collection('users').get();
                allUsers = [];
                
                snapshot.forEach(doc => {
                    allUsers.push({
                        id: doc.id,
                        ...doc.data()
                    });
                });
                
                updateStats();
                displayUsers();
                
            } catch (error) {
                console.error("Erreur:", error);
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: red; padding: 50px;">
                    <i class="fas fa-exclamation-triangle"></i> Erreur: ${error.message}
                </td></tr>`;
            }
        }
        
        // Mettre à jour les statistiques
        function updateStats() {
            const total = allUsers.length;
            const paid = allUsers.filter(u => u.paid).length;
            
            document.getElementById('totalUsers').textContent = total;
            document.getElementById('paidUsers').textContent = paid;
            document.getElementById('freeUsers').textContent = total - paid;
        }
        
        // Afficher les utilisateurs
        function displayUsers() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allUsers.filter(u => 
                u.email && u.email.toLowerCase().includes(searchTerm)
            );
            
            // Trier par date d'inscription (plus récent d'abord)
            filtered.sort((a, b) => {
                const dateA = a.createdAt?.toDate?.() || new Date(0);
                const dateB = b.createdAt?.toDate?.() || new Date(0);
                return dateB - dateA;
            });
            
            if (filtered.length === 0) {
                document.getElementById('usersTableBody').innerHTML = `
                    <tr><td colspan="5" style="text-align: center; padding: 50px; color: #666;">
                        <i class="fas fa-search"></i> Aucun utilisateur trouvé
                    </td></tr>
                `;
                return;
            }
            
            let html = '';
            
            filtered.forEach(user => {
                const createdAt = user.createdAt?.toDate?.()?.toLocaleString('fr-FR') || 'Inconnue';
                const lastActive = user.lastActive?.toDate?.()?.toLocaleString('fr-FR') || 'Jamais';
                
                html += `
                    <tr>
                        <td><strong>${user.email || 'Email inconnu'}</strong></td>
                        <td>
                            <span class="${user.paid ? 'status-paid' : 'status-free'}">
                                ${user.paid ? '✅ PAYANT' : '⏳ GRATUIT'}
                            </span>
                        </td>
                        <td>${createdAt}</td>
                        <td>${lastActive}</td>
                        <td>
                            <button class="btn-paid" onclick="setPaid('${user.id}', true)" ${user.paid ? 'disabled style="opacity:0.5"' : ''}>
                                Marquer payant
                            </button>
                            <button class="btn-unpaid" onclick="setPaid('${user.id}', false)" ${!user.paid ? 'disabled style="opacity:0.5"' : ''}>
                                Marquer gratuit
                            </button>
                        </td>
                    </tr>
                `;
            });
            
            document.getElementById('usersTableBody').innerHTML = html;
        }
        
        // Changer le statut payant/gratuit
        async function setPaid(userId, paid) {
            try {
                await db.collection('users').doc(userId).update({
                    paid: paid
                });
                
                // Recharger la liste
                await loadUsers();
                
            } catch (error) {
                alert('Erreur: ' + error.message);
            }
        }
        
        // Exporter en CSV
        function exportToCSV() {
            let csv = "Email,Statut,Date d'inscription,Dernière activité\n";
            
            allUsers.forEach(user => {
                const createdAt = user.createdAt?.toDate?.()?.toLocaleString('fr-FR') || '';
                const lastActive = user.lastActive?.toDate?.()?.toLocaleString('fr-FR') || '';
                const statut = user.paid ? 'Payant' : 'Gratuit';
                
                csv += `"${user.email}",${statut},"${createdAt}","${lastActive}"\n`;
            });
            
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'utilisateurs.csv';
            a.click();
        }
        
        // Recherche en temps réel
        document.getElementById('searchInput').addEventListener('input', () => {
            clearTimeout(window.searchTimeout);
            window.searchTimeout = setTimeout(displayUsers, 300);
        });
        
        // Actualiser
        document.getElementById('refreshBtn').addEventListener('click', loadUsers);
        
        // Exporter
        document.getElementById('exportBtn').addEventListener('click', exportToCSV);
        
        // Charger au démarrage
        loadUsers();
        
        // Actualiser automatiquement toutes les 30 secondes
        setInterval(loadUsers, 30000);
    </script>
</body>
</html>
